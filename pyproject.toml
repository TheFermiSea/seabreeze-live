[project]
name = "seabreeze-live"
version = "0.2.0"
description = "Live Ocean Optics spectrometer acquisition and visualization TUI"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "seabreeze>=2.0.0",
  "numpy>=1.24.0",
  "scipy>=1.10.0",
  "h5py>=3.8.0",
  "textual>=0.50.0",
  "textual-plot>=0.1.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0.0", "ruff>=0.2.0"]

[project.scripts]
seabreeze-live = "seabreeze_live.cli:main"
