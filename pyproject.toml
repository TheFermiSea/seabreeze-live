[project]
name = "seabreeze-live"
version = "0.1.0"
description = "Live acquisition wrapper for python-seabreeze with HDF5/CSV/NDJSON output."
readme = "README.md"
authors = [
    { name = "TheFermiSea", email = "squires.b@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "numpy>=1.26",
]

[project.optional-dependencies]
hardware = ["seabreeze>=2.0"]
hdf5 = ["h5py>=3.10"]
plot = ["matplotlib>=3.8"]
dev = ["pytest>=8", "pytest-cov", "h5py>=3.10", "matplotlib>=3.8"]

[project.scripts]
seabreeze-live = "seabreeze_live.cli:main"

[build-system]
requires = ["uv_build>=0.8.19,<0.9.0"]
build-backend = "uv_build"
